<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test API Path</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h2>Test API Path Fix</h2>
        <p>This page tests that the API path is working correctly from the dashboard.</p>
        
        <div class="row">
            <div class="col-md-6">
                <h4>Test API Calls</h4>
                <div class="mb-3">
                    <button class="btn btn-primary" onclick="testSearchAPI()">Test Search API</button>
                    <button class="btn btn-success" onclick="testGetAllAPI()">Test Get All API</button>
                </div>
                
                <div id="apiResults" class="border p-3 rounded" style="min-height: 200px;">
                    <div class="text-muted">Click buttons above to test API calls...</div>
                </div>
            </div>
            
            <div class="col-md-6">
                <h4>Test Food Cards</h4>
                <div class="row">
                    <div class="col-md-6 mb-2">
                        <button class="btn btn-outline-primary w-100" onclick="testFoodCard('whole_grain_bread', '2', 'slice')">
                            <div class="meal-item">
                                <i class="fas fa-bread-slice"></i>
                                <span>Whole Grain Bread</span>
                                <small>2 slices</small>
                            </div>
                        </button>
                    </div>
                    <div class="col-md-6 mb-2">
                        <button class="btn btn-outline-success w-100" onclick="testFoodCard('oatmeal', '50', 'g')">
                            <div class="meal-item">
                                <i class="fas fa-bowl-food"></i>
                                <span>Oatmeal</span>
                                <small>50g dry</small>
                            </div>
                        </button>
                    </div>
                </div>
                
                <div id="foodResults" class="border p-3 rounded mt-3" style="min-height: 200px;">
                    <div class="text-muted">Click food cards above to test...</div>
                </div>
            </div>
        </div>
        
        <div class="mt-4">
            <a href="pages/dashboard.php" class="btn btn-secondary">← Back to Dashboard</a>
            <a href="test_all_meal_cards.html" class="btn btn-info">Test All Meal Cards</a>
        </div>
    </div>

    <script>
        function testSearchAPI() {
            const resultsDiv = document.getElementById('apiResults');
            resultsDiv.innerHTML = '<div class="text-info">Testing search API...</div>';
            
            fetch('../php/food_api.php?action=search&q=whole_grain_bread&limit=3')
                .then(response => {
                    console.log('Response status:', response.status);
                    console.log('Response URL:', response.url);
                    return response.text();
                })
                .then(text => {
                    console.log('Raw response:', text);
                    try {
                        const data = JSON.parse(text);
                        resultsDiv.innerHTML = `
                            <div class="alert alert-success">
                                <h6>Search API Success!</h6>
                                <p>URL: ${response.url}</p>
                                <pre>${JSON.stringify(data, null, 2)}</pre>
                            </div>
                        `;
                    } catch (e) {
                        resultsDiv.innerHTML = `
                            <div class="alert alert-danger">
                                <h6>JSON Parse Error!</h6>
                                <p>Raw response: ${text}</p>
                                <p>Error: ${e.message}</p>
                            </div>
                        `;
                    }
                })
                .catch(error => {
                    console.error('Fetch error:', error);
                    resultsDiv.innerHTML = `
                        <div class="alert alert-danger">
                            <h6>Fetch Error!</h6>
                            <p>${error.message}</p>
                        </div>
                    `;
                });
        }

        function testGetAllAPI() {
            const resultsDiv = document.getElementById('apiResults');
            resultsDiv.innerHTML = '<div class="text-info">Testing get all API...</div>';
            
            fetch('../php/food_api.php?action=get_all&limit=3')
                .then(response => {
                    console.log('Response status:', response.status);
                    console.log('Response URL:', response.url);
                    return response.text();
                })
                .then(text => {
                    console.log('Raw response:', text);
                    try {
                        const data = JSON.parse(text);
                        resultsDiv.innerHTML = `
                            <div class="alert alert-success">
                                <h6>Get All API Success!</h6>
                                <p>URL: ${response.url}</p>
                                <pre>${JSON.stringify(data, null, 2)}</pre>
                            </div>
                        `;
                    } catch (e) {
                        resultsDiv.innerHTML = `
                            <div class="alert alert-danger">
                                <h6>JSON Parse Error!</h6>
                                <p>Raw response: ${text}</p>
                                <p>Error: ${e.message}</p>
                            </div>
                        `;
                    }
                })
                .catch(error => {
                    console.error('Fetch error:', error);
                    resultsDiv.innerHTML = `
                        <div class="alert alert-danger">
                            <h6>Fetch Error!</h6>
                            <p>${error.message}</p>
                        </div>
                    `;
                });
        }

        function testFoodCard(foodKey, amount, unit) {
            const resultsDiv = document.getElementById('foodResults');
            resultsDiv.innerHTML = `<div class="text-info">Testing food card: ${foodKey}...</div>`;
            
            console.log('Testing food card:', { foodKey, amount, unit });
            
            // Test the same API call that the dashboard makes
            fetch(`../php/food_api.php?action=search&q=${encodeURIComponent(foodKey)}&limit=1`)
                .then(response => {
                    console.log('API response status:', response.status);
                    console.log('API response URL:', response.url);
                    return response.text();
                })
                .then(text => {
                    console.log('API raw response:', text);
                    try {
                        const data = JSON.parse(text);
                        if (data.error || !data.foods || data.foods.length === 0) {
                            resultsDiv.innerHTML = `
                                <div class="alert alert-warning">
                                    <h6>Food Not Found in API!</h6>
                                    <p>Error: ${data.error || 'No foods found'}</p>
                                    <p>URL: ${response.url}</p>
                                </div>
                            `;
                        } else {
                            const apiFood = data.foods[0];
                            resultsDiv.innerHTML = `
                                <div class="alert alert-success">
                                    <h6>Found in API!</h6>
                                    <p>Food: ${apiFood.name}</p>
                                    <p>Calories/100g: ${apiFood.calories_per_100g}</p>
                                    <p>Protein: ${apiFood.protein}g</p>
                                    <p>URL: ${response.url}</p>
                                    <p>This would be added to the meal successfully.</p>
                                </div>
                            `;
                        }
                    } catch (e) {
                        resultsDiv.innerHTML = `
                            <div class="alert alert-danger">
                                <h6>API Response Parse Error!</h6>
                                <p>Raw response: ${text}</p>
                                <p>Error: ${e.message}</p>
                                <p>URL: ${response.url}</p>
                            </div>
                        `;
                    }
                })
                .catch(error => {
                    console.error('API fetch error:', error);
                    resultsDiv.innerHTML = `
                        <div class="alert alert-danger">
                            <h6>API Fetch Error!</h6>
                            <p>${error.message}</p>
                        </div>
                    `;
                });
        }
    </script>

    <style>
        .meal-item {
            padding: 10px;
            text-align: center;
        }
        
        .meal-item i {
            font-size: 1.5em;
            margin-bottom: 5px;
            display: block;
        }
        
        .meal-item span {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .meal-item small {
            display: block;
            color: #666;
        }
        
        pre {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 4px;
            font-size: 0.8em;
            max-height: 200px;
            overflow-y: auto;
        }
    </style>
</body>
</html>
